name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No secrets in client bundles
        run: |
          if grep -rIl -E "KITE_API_SECRET|TOKEN_ENC_KEY|UPSTASH_REDIS_REST_TOKEN|api_secret|access_token" .next/static; then
            echo "::error::secret names found in client bundles"; exit 1
          fi
          echo "client bundles clean"
